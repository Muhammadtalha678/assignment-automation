name: Build and Deploy to Hugging Face

on:
  push:
    branches:
      - main  # Agar aap ki main branch ka naam 'master' hai, toh yahan master likhein

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend        # GitHub ko bataya ke code backend folder mein hai
        file: ./backend/Dockerfile # Dockerfile ka sahi rasta
        push: true
        platforms: linux/arm64
          # Aap ka Docker Hub repo aur latest tag
          # Aap ka Docker Hub repo aur latest tag
        tags: | 
          muhammadtalha678/english_backend:latest  
    
    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./assignment-generator-form        # GitHub ko bataya ke code backend folder mein hai
        file: ./assignment-generator-form/Dockerfile # Dockerfile ka sahi rasta
        push: true
        platforms: linux/arm64
          # Aap ka Docker Hub repo aur latest tag
          # Aap ka Docker Hub repo aur latest tag
        tags: | 
          muhammadtalha678/english_frontend:latest  
    
    - name: Deploy to Oracle VM
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.ORACLE_HOST }}
        username: ubuntu
        key: ${{ secrets.ORACLE_SSH_KEY }}
        script: |
          cd /home/ubuntu
          docker-compose pull
          docker-compose down
          docker-compose up -d