<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat with Image Upload</title>
    <style>
        .hidden { display: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Chat & Document Generator</h2>

    <!-- Step 1: Language Selection -->
    <div class="form-group">
        <label for="language">1. Select Language:</label>
        <select id="language" onchange="handleLanguageChange()">
            <option value="">-- Choose Language --</option>
            <option value="English">English</option>
            <option value="Urdu">Urdu</option>
        </select>
    </div>

    <!-- Step 2: Main Dynamic Form Container -->
    <div id="mainFormContainer" class="hidden">
        <form id="chatForm">
            <div class="form-group">
                <label>Assignment No:</label>
                <input type="number" id="assignment_no" value="1" required>
            </div>
            <div class="form-group">
                <label>Course Code:</label>
                <input type="number" id="course_code" value="3312" required>
            </div>
            <div class="form-group">
                <label>Semester:</label>
                <input type="text" id="semester" value="Fall 2026" required>
            </div>
            <div class="form-group">
                <label>Student Name:</label>
                <input type="text" id="student_name" value="Zeeshan" required>
            </div>
            <div class="form-group">
                <label>Registration ID:</label>
                <input type="text" id="registration_id" value="SP26-BCS-042" required>
            </div>

            <!-- Dynamic Questions Container -->
            <div class="form-group">
                <label>Questions:</label>
                <div id="questionsWrapper">
                    <input type="text" class="question-input" placeholder="Question 1" required style="width: 80%; margin-bottom: 5px;">
                </div>
                <button type="button" onclick="addQuestionInput()">+ Add Question</button>
            </div>

            <!-- Logo Upload -->
            <div class="form-group">
                <label>Upload Logo (Max 200KB JPEG/PNG):</label>
                <input type="file" id="logo_image" accept="image/jpeg, image/png" required>
            </div>

            <button type="button" onclick="submitData()">Submit & Download Document</button>
        </form>
    </div>

    <script>
        // Language select hone par baqi form show karna
        function handleLanguageChange() {
            const lang = document.getElementById("language").value;
            const container = document.getElementById("mainFormContainer");
            if (lang !== "") {
                container.classList.remove("hidden");
            } else {
                container.classList.add("hidden");
            }
        }

        // Dynamic question inputs add karna (1, 2, 3 so on...)
        function addQuestionInput() {
            const wrapper = document.getElementById("questionsWrapper");
            const currentCount = wrapper.getElementsByClassName("question-input").length + 1;
            
            const newInput = document.createElement("input");
            newInput.type = "text";
            newInput.className = "question-input";
            newInput.placeholder = `Question ${currentCount}`;
            newInput.style.width = "80%";
            newInput.style.marginBottom = "5px";
            newInput.required = true;
            
            wrapper.appendChild(newInput);
        }

        // Main Submit function using Fetch API
        async function submitData() {
            const fileInput = document.getElementById("logo_image");
            if (fileInput.files.length === 0) {
                alert("Please select a logo image first!");
                return;
            }

            // 1. Collect all dynamic questions
            const questionElements = document.getElementsByClassName("question-input");
            const questionsArray = [];
            for (let input of questionElements) {
                if (input.value.trim() !== "") {
                    questionsArray.push(input.value.trim());
                }
            }

            // 2. Prepare Text Payload structured object
            const textPayload = {
                assignment_no: parseInt(document.getElementById("assignment_no").value),
                course_code: parseInt(document.getElementById("course_code").value),
                semester: document.getElementById("semester").value,
                student_name: document.getElementById("student_name").value,
                registration_id: document.getElementById("registration_id").value,
                questions: questionsArray,
                language: document.getElementById("language").value
            };

            // 3. Construct FormData (Barra Box)
            const formData = new FormData();
            formData.append("logo_image", fileInput.files[0]); // Binary part
            formData.append("chatData", JSON.stringify(textPayload)); // Text part

            try {
                const response = await fetch("http://127.0.0.1:8000/api/chat", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    alert("Error: " + JSON.stringify(errData.detail));
                    return;
                }

                // --- INLINE FILE DOWNLOAD TRICK ---
                // Binary response (docx) ko blob mein receive karna
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                
                const tempLink = document.createElement('a');
                tempLink.href = downloadUrl;
                // File ka download name set kiya
                tempLink.setAttribute('download', `${textPayload.student_name}_assignment.docx`);
                document.body.appendChild(tempLink);
                tempLink.click(); // Automatic browser trigger
                document.body.removeChild(tempLink);
                
                alert("Document successfully downloaded!");

            } catch (error) {
                console.error("Submission failed:", error);
                alert("Request failed. Check console network log.");
            }
        }
    </script>
</body>
</html>
